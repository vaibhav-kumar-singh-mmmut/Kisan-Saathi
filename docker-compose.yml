services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  ml-model:
    image: python:3.12-slim
    working_dir: /app/ml-model
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    command: >
      bash -c "pip install -r requirements.txt && uvicorn ml_service:app --host 0.0.0.0 --port 8001 --reload"

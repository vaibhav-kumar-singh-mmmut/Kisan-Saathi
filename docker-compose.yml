services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml-model:/app/ml-model
      - ./disease_lookup.json:/app/disease_lookup.json

      - ./seed-data:/app/seed-data
    environment:
      - APP_ENV=development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
